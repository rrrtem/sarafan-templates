<div class="card-unit" data-variant-group="text"><div class="card-shell" role="group" aria-roledescription="слайд" aria-label="Что изменилось"><article class="ig-card bureau-card bureau-grid bureau-cream" data-bureau-variant="change" aria-label="Что изменилось"><h2 class="bureau-block bureau-heading" style="grid-column:1 / 7;grid-row:1 / 2">Что изменилось</h2><p class="bureau-block bureau-body" style="grid-column:1 / 7;grid-row:2 / 4">Сформулируйте суть изменения в двух-трёх предложениях: что произошло и почему читателю стоит об этом знать.</p><div class="bureau-block bureau-prose" style="grid-column:1 / 4;grid-row:4 / 7"><h3 class="bureau-serif">Раньше</h3><p class="bureau-body">Кратко опишите прежний порядок. Оставьте только то, что помогает понять разницу.</p></div><div class="bureau-block bureau-prose" style="grid-column:4 / 7;grid-row:4 / 7"><h3 class="bureau-serif">Теперь</h3><p class="bureau-body">Покажите новый порядок. Выделите главное отличие, без длинной предыстории.</p></div></article></div></div>
<div class="card-unit" data-variant-group="text"><div class="card-shell" role="group" aria-roledescription="слайд" aria-label="Кого касается"><article class="ig-card bureau-card bureau-grid" data-bureau-variant="audience" aria-label="Кого касается"><h2 class="bureau-block bureau-heading" style="grid-column:1 / 7;grid-row:1 / 3">Кого это<br>касается</h2><div class="bureau-block bureau-row bureau-row--rule" style="grid-column:1 / 7;grid-row:3 / 4"><h3 class="bureau-label">Живёте</h3><p class="bureau-body">Опишите статус или ситуацию читателя.</p></div><div class="bureau-block bureau-row bureau-row--rule" style="grid-column:1 / 7;grid-row:4 / 5"><h3 class="bureau-label">Работаете</h3><p class="bureau-body">Уточните, для кого важно изменение.</p></div><div class="bureau-block bureau-row bureau-row--rule" style="grid-column:1 / 7;grid-row:5 / 6"><h3 class="bureau-label">Открываете бизнес</h3><p class="bureau-body">Назовите условия и ограничения.</p></div><p class="bureau-block bureau-note bureau-bottom" style="grid-column:1 / 7;grid-row:6 / 7">Категории — пример структуры. Замените их теми, к кому относится ваш материал.</p></article></div></div>
<div class="card-unit" data-variant-group="text"><div class="card-shell" role="group" aria-roledescription="слайд" aria-label="Что делать"><article class="ig-card bureau-card bureau-grid bureau-cream" data-bureau-variant="actions" aria-label="Что делать"><h2 class="bureau-block bureau-heading" style="grid-column:1 / 7;grid-row:1 / 2">Что делать</h2><div class="bureau-block bureau-row bureau-row--rule" style="grid-column:1 / 7;grid-row:2 / 3"><h3 class="bureau-label">Первый шаг</h3><p class="bureau-body">Одно конкретное действие, с которого начать.</p></div><div class="bureau-block bureau-row bureau-row--rule" style="grid-column:1 / 7;grid-row:3 / 4"><h3 class="bureau-label">Следующий шаг</h3><p class="bureau-body">Куда обратиться или что подготовить.</p></div><div class="bureau-block bureau-row bureau-row--rule" style="grid-column:1 / 7;grid-row:4 / 5"><h3 class="bureau-label">После этого</h3><p class="bureau-body">Как понять, что вопрос решён.</p></div><p class="bureau-block bureau-body bureau-bottom" style="grid-column:1 / 7;grid-row:6 / 7">Один шаг — одно действие. Замените подсказки реальной последовательностью.</p></article></div></div>
<div class="card-unit" data-variant-group="text"><div class="card-shell" role="group" aria-roledescription="слайд" aria-label="Документы и сроки"><article class="ig-card bureau-card bureau-grid" data-bureau-variant="documents" aria-label="Документы и сроки"><h2 class="bureau-block bureau-heading" style="grid-column:1 / 7;grid-row:1 / 3">Документы<br>и сроки</h2><div class="bureau-block bureau-prose" style="grid-column:1 / 4;grid-row:3 / 6"><h3 class="bureau-label">Документы</h3><p class="bureau-body">Перечислите, что понадобится. Отметьте, где нужен оригинал, а где достаточно копии.</p></div><div class="bureau-block bureau-prose" style="grid-column:4 / 7;grid-row:3 / 6"><h3 class="bureau-label">Сроки</h3><p class="bureau-body">Укажите подтверждённую дату, период или условие. Не оставляйте читателю догадок.</p></div><p class="bureau-block bureau-note bureau-bottom" style="grid-column:1 / 7;grid-row:6 / 7">В этом блоке — официальный источник и дата проверки материала.</p></article></div></div>
<div class="card-unit" data-variant-group="accent"><div class="card-shell" role="group" aria-roledescription="слайд" aria-label="Важный нюанс"><article class="ig-card bureau-card bureau-grid bureau-cream" data-bureau-variant="nuance" aria-label="Важный нюанс"><h2 class="bureau-block bureau-statement bureau-middle" style="grid-column:1 / 7;grid-row:2 / 5">Здесь —<br><em>важный</em><br>нюанс</h2><p class="bureau-block bureau-body bureau-bottom" style="grid-column:1 / 7;grid-row:6 / 7">Одна оговорка, от которой зависит результат. Объясните её коротко и на понятном примере.</p></article></div></div>
<div class="card-unit" data-variant-group="finale"><div class="card-shell" role="group" aria-roledescription="слайд" aria-label="Итог и сохранение"><article class="ig-card bureau-card bureau-grid" data-bureau-variant="summary" aria-label="Итог и сохранение"><h2 class="bureau-block bureau-heading" style="grid-column:1 / 7;grid-row:1 / 3">Коротко:<br>что запомнить</h2><ul class="bureau-block bureau-body bureau-list" style="grid-column:1 / 7;grid-row:3 / 6"><li>Главное изменение — одним предложением.</li><li>Первое действие — коротким понятным глаголом.</li><li>Срок или условие, которое нельзя пропустить.</li></ul><p class="bureau-block bureau-note bureau-bottom" style="grid-column:1 / 7;grid-row:6 / 7">Сохраните карусель, чтобы вернуться к ней, когда понадобится.</p></article></div></div>
