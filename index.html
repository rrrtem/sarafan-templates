<div class="card-unit"><div class="card-shell" role="group" aria-roledescription="слайд" aria-label="Салон · Обложка и типографика"><article class="ig-card club-card club-salon-cover" data-node-id="373:5535" aria-label="Салон · Обложка и типографика" style=""><img class="club-dot" src="assets/club-5535-ellipse31.svg" alt="" style="left:109px;top:580px" aria-hidden="true"><img class="club-dot" src="assets/club-5535-ellipse37.svg" alt="" style="left:453px;top:-47px" aria-hidden="true"><img class="club-dot" src="assets/club-5535-ellipse32.svg" alt="" style="left:933px;top:332px" aria-hidden="true"><p class="club-address">66 rue Notre-Dame de Nazareth, 75003</p><h2 class="club-cinema club-salon-title">Салон</h2><p class="club-cinema club-range">5—30</p><p class="club-cinema club-month">ноября</p><p class="club-cinema club-brand-title">сарафан</p><p class="club-program-list">открытые встречи за кофе ✚ концерты и&nbsp;музыкальные вечера ✚ лекции<br>✚ чтения ✚ дегустации ✚ винное казино ✚&nbsp;перформанс ✚ творческие вечера ✚&nbsp;детские мастерские ✚ …многое-многое другое</p><p class="club-cta">подробнее →</p><img class="club-dot" src="assets/club-5535-ellipse30.svg" alt="" style="left:393px;top:390px" aria-hidden="true"><img class="club-dot" src="assets/club-5535-ellipse35.svg" alt="" style="left:748px;top:596px" aria-hidden="true"><img class="club-dot" src="assets/club-5535-ellipse36.svg" alt="" style="left:153px;top:174px" aria-hidden="true"><img class="club-dot" src="assets/club-5535-ellipse33.svg" alt="" style="left:712px;top:79px" aria-hidden="true"><img class="club-dot" src="assets/club-5535-ellipse34.svg" alt="" style="left:609px;top:754px" aria-hidden="true"><img class="club-address-photo" src="assets/club-5535-screenshot20261027at1436031.png" alt="Интерьер Салона" ><img class="club-mark" src="assets/club-5535-group93.svg" alt="" aria-hidden="true"></article></div></div>
<div class="card-unit"><div class="card-shell" role="group" aria-roledescription="слайд" aria-label="Салон · Приглашение на встречи"><article class="ig-card club-card club-salon-story" data-node-id="373:5874" aria-label="Салон · Приглашение на встречи" style=""><img class="club-room-photo" src="assets/club-5874-ellipse17.png" alt="Общий стол в пространстве Салона" ><div class="club-story-copy"><p>Друзья, мы снова приглашаем вас на встречи друг с другом! </p><p>В марте этого года мы попробовали перенести наше сообщество из экранов телефона в настоящее пространство — и это был месяц, который мы до сих пор вспоминаем. <em>Вы приходили на кофе, оставались на лекции, знакомились, спорили, смеялись, учились, танцевали и возвращались снова. </em></p><p>Стало понятно: такому месту быть. Поэтому в ноябре — новая глава, больше, смелее и насыщеннее.</p></div></article></div></div>
<div class="card-unit"><div class="card-shell" role="group" aria-roledescription="слайд" aria-label="Салон · Партнёр и программа"><article class="ig-card club-card club-salon-partner" data-node-id="373:5877" aria-label="Салон · Партнёр и программа" style=""><img class="club-partner-photo" src="assets/club-5877-telegramcloudphotosize45972135932305543156y1.png" alt="Дима Макаров и Варя в Париже" ><div class="club-partner-shade"></div><p class="club-partner-copy">В этот раз партнёром Салона выступает <em>Дима Макаров</em>, и вместе мы собрали программу, в которой каждый вечер — повод выйти из дома.</p><p class="club-cta">программа →</p></article></div></div>

<div class="card-unit"><div class="card-shell" role="group" aria-roledescription="слайд" aria-label="Просмотр и обсуждение фильма «Ниночка»"><article class="ig-card club-card club-poster club-poster--film" data-node-id="373:5883" aria-label="Просмотр и обсуждение фильма «Ниночка»" style="--club-background:#91945B;--club-color:#FBEED2"><img class="club-poster-photo" src="assets/club-5883-ellipse17.png" alt="Кадр из фильма «Ниночка»" ><p class="club-cinema club-poster-date">5/11</p><p class="club-poster-time">четверг, <br>19:00</p><div class="club-ribbon" aria-hidden="true"><div class="club-ribbon-vertical"><img class="" src="assets/club-5883-rectangle71.svg" alt="" ></div></div><p class="club-ribbon-name">Сарафан</p><p class="club-ribbon-salon">Салон</p><div class="club-price-wrap"><p class="club-price">€10</p></div><img class="club-mark" src="assets/club-5883-group93.svg" alt="" aria-hidden="true"><div class="club-poster-copy"><div class="club-poster-heading-zone"><h2 class="club-cinema club-poster-title">Просмотр<br>и обсуждение фильма<br>«Ниночка»</h2></div><p class="club-poster-description">Смотрим комедию 1939 года Эрнста Любича с Гретой Гарбо о советской комиссарше, которая приезжает в Париж и неожиданно влюбляется. После показа обсудим фильм, столкновение двух миров и удивительную историю его создания вместе с Дмитрием Макаровым.</p></div></article></div></div>
<div class="card-unit"><div class="card-shell" role="group" aria-roledescription="слайд" aria-label="дегустация грузинских вин"><article class="ig-card club-card club-poster club-poster--georgia" data-node-id="373:6218" aria-label="дегустация грузинских вин" style="--club-background:#E19A9B;--club-color:#FBEED2"><img class="club-poster-photo" src="assets/club-6218-ellipse17.png" alt="Сомелье Наталья с бутылкой вина" ><p class="club-cinema club-poster-date">6/11</p><p class="club-poster-time">пятница, 12:30–14:30</p><div class="club-ribbon" aria-hidden="true"><div class="club-ribbon-vertical"><img class="" src="assets/club-6218-rectangle71.svg" alt="" ></div></div><p class="club-ribbon-name">Сарафан</p><p class="club-ribbon-salon">Салон</p><div class="club-price-wrap"><p class="club-price">€50</p></div><img class="club-mark" src="assets/club-6218-group93.svg" alt="" aria-hidden="true"><div class="club-poster-copy"><div class="club-poster-heading-zone"><h2 class="club-cinema club-poster-title">дегустация<br>грузинских вин</h2><p class="club-cinema club-poster-subtitle">С сомелье Натальей</p></div><p class="club-poster-description">Открываем для себя грузинское виноделие за пределами привычных Хванчкары и Киндзмараули. Сомелье Наталья расскажет о древней традиции квеври, развеет популярные мифы и познакомит с неожиданными винами Грузии. В программе дегустация и обед.</p></div></article></div></div>
<div class="card-unit"><div class="card-shell" role="group" aria-roledescription="слайд" aria-label="Вечеринка-открытие салона"><article class="ig-card club-card club-poster club-poster--party" data-node-id="373:6554" aria-label="Вечеринка-открытие салона" style="--club-background:#E19A9B;--club-color:#FBEED2"><img class="club-poster-photo" src="assets/club-6554-ellipse17.png" alt="Танцы на вечеринке Салона" ><p class="club-cinema club-poster-date">6/11</p><p class="club-poster-time">пятница, 19:00</p><div class="club-ribbon" aria-hidden="true"><div class="club-ribbon-vertical"><img class="" src="assets/club-6554-rectangle71.svg" alt="" ></div></div><p class="club-ribbon-name">Сарафан</p><p class="club-ribbon-salon">Салон</p><div class="club-price-wrap"><p class="club-price">Вход свободный</p></div><img class="club-mark" src="assets/club-6554-group93.svg" alt="" aria-hidden="true"><div class="club-poster-copy"><div class="club-poster-heading-zone"><h2 class="club-cinema club-poster-title">Вечеринка-<br>открытие<br>салона</h2></div><p class="club-poster-description">Собираемся на большую вечеринку в честь открытия ноябрьского Салона! Будем знакомиться, встречаться со старыми друзьями, пить вино и строить планы на месяц. Приходите провести вечер с Варей, Димой и нашим сообществом.</p></div></article></div></div>
<div class="card-unit"><div class="card-shell" role="group" aria-roledescription="слайд" aria-label="Король белых вин"><article class="ig-card club-card club-poster club-poster--riesling" data-node-id="373:6889" aria-label="Король белых вин" style="--club-background:#A9C9DF;--club-color:#553D3D"><img class="club-poster-photo" src="assets/club-6889-ellipse17.png" alt="Дегустация белого вина" ><p class="club-cinema club-poster-date">7/11</p><p class="club-poster-time">суббота, 16:00–18:00</p><div class="club-ribbon" aria-hidden="true"><div class="club-ribbon-vertical"><img class="" src="assets/club-6889-rectangle71.svg" alt="" ></div></div><p class="club-ribbon-name">Сарафан</p><p class="club-ribbon-salon">Салон</p><div class="club-price-wrap"><p class="club-price">€70</p></div><img class="club-mark" src="assets/club-6889-group93.svg" alt="" aria-hidden="true"><div class="club-poster-copy"><div class="club-poster-heading-zone"><h2 class="club-cinema club-poster-title">Король<br>белых вин</h2><p class="club-cinema club-poster-subtitle">расшифровываем рислинг</p></div><p class="club-poster-description">Отправляемся в винное путешествие по Франции, Германии и Австралии, чтобы узнать, насколько разным бывает рислинг. Вместе с винным журналистом Яшей Лысенко сравним вина, разберемся в особенностях сорта и научимся узнавать его характер в бокале.</p></div></article></div></div>
<div class="card-unit"><div class="card-shell" role="group" aria-roledescription="слайд" aria-label="Концерт группы EDVA"><article class="ig-card club-card club-poster club-poster--edva" data-node-id="373:7560" aria-label="Концерт группы EDVA" style="--club-background:#A9C9DF;--club-color:#553D3D"><img class="club-poster-photo" src="assets/club-7560-ellipse17.png" alt="Группа EDVA" ><p class="club-cinema club-poster-date">7/11</p><p class="club-poster-time">суббота, <br>19:30</p><div class="club-ribbon" aria-hidden="true"><div class="club-ribbon-vertical"><img class="" src="assets/club-7560-rectangle71.svg" alt="" ></div></div><p class="club-ribbon-name">Сарафан</p><p class="club-ribbon-salon">Салон</p><div class="club-price-wrap"><p class="club-price">€25</p></div><img class="club-mark" src="assets/club-7560-group93.svg" alt="" aria-hidden="true"><div class="club-poster-copy"><div class="club-poster-heading-zone"><h2 class="club-cinema club-poster-title">Концерт<br>группы<br>EDVA</h2></div><p class="club-poster-description">Камерный концерт EDVA — проекта на пересечении авант-попа и экспериментальной электроники. Необычный голос, атмосферные аранжировки и музыка, в которой слышны отголоски Björk, Erykah Badu и Kate Bush. В этот вечер группа исполнит авторскую программу.</p></div></article></div></div>
